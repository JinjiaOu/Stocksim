<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockSim</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">StockSim <span class="badge-virtual">虚拟交易</span></div>
  <select id="account-select" title="切换存档"></select>
  <div id="market-pill" class="pill">…</div>
  <div id="replay-controls" class="replay-controls" hidden>
    <span class="muted">推进</span>
    <button data-step="half">半天</button>
    <button data-step="day">1 天</button>
    <button data-step="week">1 周</button>
    <button data-step="month">1 月</button>
  </div>
  <div class="spacer"></div>
  <a href="guide.html"><button class="ghost">新手指南</button></a>
  <button id="new-account-btn" class="ghost">新建存档</button>
  <button id="reset-btn" class="ghost danger">重置账户</button>
  <button id="archive-btn" class="ghost danger" hidden>归档</button>
</header>
<div id="margin-banner" class="banner" hidden></div>

<main class="layout">
  <aside class="sidebar">
    <section class="card summary" id="summary"></section>

    <section class="card">
      <div class="search">
        <input id="search-input" placeholder="搜索代码或公司，回车直接打开" autocomplete="off">
        <ul id="search-results" class="dropdown" hidden></ul>
      </div>
      <div class="tabs" id="list-tabs">
        <button data-list="watch" class="active">自选</button>
        <button data-list="companies">公司列表</button>
      </div>
      <ul id="watchlist" class="watchlist"></ul>
      <div id="companies" hidden>
        <input id="company-filter" placeholder="筛选：代码 / 中文名 / 英文名" autocomplete="off">
        <div id="sector-chips" class="chips"></div>
        <ul id="company-list" class="watchlist companies"></ul>
      </div>
    </section>
  </aside>

  <section class="center">
    <section class="card">
      <div class="quote-head">
        <div>
          <span id="q-symbol" class="q-symbol">—</span>
          <button id="watch-toggle" class="star" title="加入/移出自选">☆</button>
        </div>
        <div class="q-price-wrap">
          <span id="q-price" class="q-price">—</span>
          <span id="q-change" class="q-change"></span>
        </div>
        <div id="q-meta" class="q-meta muted"></div>
        <div id="q-desc" class="q-desc muted"></div>
        <div class="spacer"></div>
        <div id="range-tabs" class="tabs small"></div>
      </div>
      <div id="chart" class="chart"></div>
    </section>

    <section class="card">
      <div class="tabs" id="bottom-tabs">
        <button data-tab="positions" class="active">持仓</button>
        <button data-tab="open">挂单</button>
        <button data-tab="orders">订单历史</button>
        <button data-tab="fills">成交</button>
      </div>
      <div id="tab-body" class="table-wrap"></div>
    </section>
  </section>

  <aside class="ticket card">
    <h3>下单</h3>
    <div class="seg" id="side-seg">
      <button data-side="buy" class="active buy">买入</button>
      <button data-side="sell" class="sell">卖出</button>
    </div>
    <div class="seg" id="type-seg">
      <button data-type="market" class="active">市价</button>
      <button data-type="limit">限价</button>
    </div>
    <label>股票<input id="t-symbol" readonly></label>
    <label>数量（股）<input id="t-qty" type="number" min="1" step="1" value="10"></label>
    <div class="qty-shortcuts" id="qty-shortcuts">
      <button data-frac="0.25">25%</button><button data-frac="0.5">50%</button><button data-frac="1">全部</button>
    </div>
    <label id="t-limit-wrap" hidden>限价（USD）<input id="t-limit" type="number" min="0.0001" step="0.01"></label>
    <div class="est" id="t-est"></div>
    <button id="t-submit" class="primary buy">买入</button>
    <p id="t-note" class="note muted">当日有效（DAY）。成交为模拟估算，不代表真实可成交价格。</p>
  </aside>
</main>

<dialog id="confirm-dialog">
  <form method="dialog">
    <h3>确认订单</h3>
    <div id="confirm-body"></div>
    <div class="dialog-actions">
      <button value="cancel" class="ghost">取消</button>
      <button value="ok" class="primary" id="confirm-ok">确认提交</button>
    </div>
  </form>
</dialog>

<dialog id="account-dialog">
  <form method="dialog">
    <h3>新建存档</h3>
    <label>模式
      <select id="n-mode">
        <option value="replay">历史回放（随时能玩，推进时间）</option>
        <option value="live">实时（交易时段用最新行情）</option>
      </select>
    </label>
    <label>账户类型
      <select id="n-type">
        <option value="cash">现金账户（只能做多，不借钱）</option>
        <option value="margin">保证金账户（可做空、可加杠杆）</option>
      </select>
    </label>
    <label id="n-leverage-wrap" hidden>杠杆
      <select id="n-leverage">
        <option value="1">1 倍（只做空，不借钱）</option>
        <option value="2" selected>2 倍（美国标准 Reg T）</option>
        <option value="4">4 倍（高风险）</option>
      </select>
    </label>
    <p id="n-margin-note" class="muted small" hidden></p>
    <label id="n-start-wrap">开始日期（留空随机）<input id="n-start" type="date" min="1994-01-01"></label>
    <label>初始资金（USD）<input id="n-initial" type="number" min="1000" step="1000" value="100000"></label>
    <p id="n-replay-note" class="muted small">回放会归档当前进行中的回放存档。价格为复权价格，早年数值会与当时实际报价不同。</p>
    <div class="dialog-actions">
      <button value="cancel" class="ghost">取消</button>
      <button value="ok" class="primary">开始</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
